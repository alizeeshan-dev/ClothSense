[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clothsense"
version = "0.1.0"
description = "Local uncertainty research with Fashion-MNIST"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "Pillow>=11",
  "matplotlib>=3.10",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["clothsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
